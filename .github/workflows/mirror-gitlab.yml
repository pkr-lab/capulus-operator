name: Mirror to GitLab

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete: {}
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mirror-gitlab
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mirror GitHub -> GitLab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_REMOTE: ${{ secrets.GITLAB_MIRROR_REMOTE }}
          GITLAB_USER: ${{ secrets.GITLAB_MIRROR_USER }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_REMOTE}" ] || [ -z "${GITLAB_USER}" ] || [ -z "${GITLAB_TOKEN}" ]; then
            echo "::warning::GITLAB_MIRROR_* Secrets fehlen, Mirror übersprungen"
            exit 0
          fi
          github_auth=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
          gitlab_auth=$(printf '%s:%s' "${GITLAB_USER}" "${GITLAB_TOKEN}" | base64 -w0)
          echo "::add-mask::${github_auth}"
          echo "::add-mask::${gitlab_auth}"
          git -c http.extraHeader="Authorization: Basic ${github_auth}" \
            clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" mirror.git
          cd mirror.git
          git -c http.extraHeader="Authorization: Basic ${gitlab_auth}" \
            push --prune "https://${GITLAB_REMOTE}" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'